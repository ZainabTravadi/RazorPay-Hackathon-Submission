[project]
name = "fluxpay"
version = "0.1.0"
description = "FluxPay Phase 1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "python-dotenv>=1.0.1",
  "pytest>=8.2.0",
  "httpx>=0.27.0,<0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
